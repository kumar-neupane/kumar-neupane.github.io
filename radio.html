<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepali FM - Kumar Neupane</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Listen to live Nepali FM stations including Radio Nepal, Kantipur FM, and more on Kumar Neupane's portfolio.">
    <meta name="keywords"
        content="Nepali FM, Radio Nepal, Kantipur FM, Live Radio, Nepal Radio Stations, Kumar Neupane">
    <meta name="author" content="Kumar Neupane">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Nepali FM - Kumar Neupane">
    <meta property="og:description" content="Listen to live Nepali FM stations.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kumar-neupane.github.io/radio.html">
    <meta property="og:image" content="https://kumar-neupane.github.io/images/latest/kumar-neupane.jpg">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/modern.css">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        /* Radio Page Specific CSS */
        .radio-container {
            padding: 2rem 0;
            margin-bottom: 5rem;
            /* Space for fixed player */
        }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .station-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .station-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: var(--accent-color);
        }

        .station-card.playing {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
        }

        .station-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            /* OR cover? try cover for circular look if wanted */
            border-radius: 50%;
            background: #fff;
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .station-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .station-freq {
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-primary);
            /* Fallback */
            background: rgba(10, 10, 20, 0.95);
            /* Dark semi-transparent */
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] .player-bar {
            background: rgba(255, 255, 255, 0.95);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 200px;
        }

        .player-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .player-text h4 {
            margin: 0;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .player-text p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        audio {
            width: 100%;
            max-width: 500px;
            height: 40px;
        }

        /* Override audio element colors if possible, typically hard */
        audio::-webkit-media-controls-panel {
            background-color: #f1f3f4;
        }

        @media (max-width: 768px) {
            .player-bar {
                flex-direction: column;
                gap: 1rem;
                padding-bottom: 1.5rem;
                /* Safe area */
            }

            .player-info {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                Kumar Neupane
            </a>
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
            <button class="menu-toggle" aria-label="Toggle Menu">
                <i class="fas fa-bars"></i>
            </button>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="publications.html">Publications</a></li>
                    <li><a href="achievement-and-participations.html">Achievements</a></li>
                    <li><a href="blog.html">Blog</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container radio-container">
        <div class="fade-in-up">
            <h1 style="text-align: center; margin-bottom: 1rem;">Nepali FM Stations</h1>

            <!-- Search and Filter Controls -->
            <div
                style="max-width: 800px; margin: 0 auto 2rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
                <input type="text" id="search-input" placeholder="Search stations..."
                    style="padding: 0.8rem 1.2rem; border-radius: 30px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); flex: 1; min-width: 200px; outline: none;">

                <select id="province-filter"
                    style="padding: 0.8rem 1.5rem; border-radius: 30px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); outline: none; cursor: pointer;">
                    <option value="all">All Provinces</option>
                    <option value="1">Province 1 (Koshi)</option>
                    <option value="2">Province 2 (Madhesh)</option>
                    <option value="3">Province 3 (Bagmati)</option>
                    <option value="4">Province 4 (Gandaki)</option>
                    <option value="5">Province 5 (Lumbini)</option>
                    <option value="6">Province 6 (Karnali)</option>
                    <option value="7">Province 7 (Sudurpashchim)</option>
                </select>
            </div>
        </div>

        <div class="station-grid fade-in-up" id="station-grid">
            <!-- Stations injected via JS -->
        </div>
    </main>

    <!-- Player Bar -->
    <div class="player-bar" id="player-bar" style="display: none;">
        <div class="player-info">
            <img src="" alt="Station Logo" id="player-img">
            <div class="player-text">
                <h4 id="player-name">Select a Station</h4>
                <p id="player-status">Playing Live</p>
            </div>
        </div>
        <audio id="audio-player" controls>
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- Footer -->
    <footer
        style="text-align: center; padding: 1rem 0; color: var(--text-secondary); margin-bottom: 80px; border-top: 1px solid var(--glass-border);">
        <div class="container">
            <p style="margin: 0;">
                &copy; 2025 Kumar Neupane. All rights reserved. |
                <a href="calendar-widget.html" target="_blank" style="color: var(--accent-color);"><span
                        style="font-size: 1.5em; vertical-align: middle; margin-right: 2px;">🇳🇵</span> Nepali
                    Calendar</a> |
                <a href="radio.html" class="active" style="color: var(--accent-color); font-weight: bold;"><span
                        style="font-size: 1.5em; vertical-align: middle; margin-right: 2px;">📻</span> Nepali FM</a>
            </p>
        </div>
    </footer>

    <script src="js/dynamic.js"></script>
    <script>
        // DOM Elements
        const grid = document.getElementById('station-grid');
        const playerBar = document.getElementById('player-bar');
        const playerImg = document.getElementById('player-img');
        const playerName = document.getElementById('player-name');
        const playerStatus = document.getElementById('player-status');
        const audioPlayer = document.getElementById('audio-player');
        const searchInput = document.getElementById('search-input');
        const provinceFilter = document.getElementById('province-filter');

        let allStations = [];

        // Fetch Stations
        fetch('js/stations.json')
            .then(response => response.json())
            .then(data => {
                allStations = data.map(s => ({
                    name: s.name,
                    url: s.streamUrl,
                    img: s.logo || 'https://cdn-icons-png.flaticon.com/512/2089/2089181.png',
                    freq: s.frequency ? `${s.frequency} MHz` : 'Online',
                    province: s.province,
                    address: s.address
                }));
                renderStations(allStations);
            })
            .catch(err => {
                console.error('Error loading stations:', err);
                grid.innerHTML = '<p style="text-align:center; color:red;">Failed to load stations data.</p>';
            });

        function renderStations(stations) {
            grid.innerHTML = '';
            if (stations.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">No stations found matching your criteria.</p>';
                return;
            }

            stations.forEach(station => {
                const card = document.createElement('div');
                card.className = 'station-card';

                card.innerHTML = `
                  <img src="${station.img}" alt="${station.name}" class="station-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2089/2089181.png'">
                  <div class="station-name">${station.name}</div>
                  <div class="station-freq">${station.freq}</div>
                  ${station.address ? `<div style="font-size: 0.8rem; color: var(--text-secondary); margin-top:0.2rem;">${station.address}</div>` : ''}
              `;
                card.addEventListener('click', () => playStation(station, card));
                grid.appendChild(card);
            });
        }

        function playStation(station, card) {
            document.querySelectorAll('.station-card').forEach(c => c.classList.remove('playing'));
            card.classList.add('playing');

            playerBar.style.display = 'flex';

            playerImg.src = station.img;
            playerImg.onerror = function () { this.src = 'https://cdn-icons-png.flaticon.com/512/2089/2089181.png'; };

            playerName.textContent = station.name;
            playerStatus.textContent = `Playing ${station.freq}`;

            audioPlayer.src = station.url;
            audioPlayer.play().catch(e => {
                console.log("Playback error:", e);
                // alert("Unable to play this station. It might be offline.");
            });
        }

        // Filter Logic
        function filterStations() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedProvince = provinceFilter.value;

            const filtered = allStations.filter(station => {
                const matchesSearch = station.name.toLowerCase().includes(searchTerm) || (station.address && station.address.toLowerCase().includes(searchTerm));
                const matchesProvince = selectedProvince === 'all' || (station.province && station.province.toString() === selectedProvince);
                return matchesSearch && matchesProvince;
            });

            renderStations(filtered);
        }

        if (searchInput) searchInput.addEventListener('input', filterStations);
        if (provinceFilter) provinceFilter.addEventListener('change', filterStations);
    </script>

</body>

</html>
