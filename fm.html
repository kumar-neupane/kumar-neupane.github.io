<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Nepal FM</title>
    <style>
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Loading Spinner -->
    <div id="loader" class="loader"></div>

    <!-- FM Widget -->
    <iframe src="https://allnepalfm.vercel.app" onload="document.getElementById('loader').classList.add('hidden')"
        style="border: none; width: 100%; height: 800px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></iframe>

    <div id="customfooter" style="margin-top:20px; text-align:center; font-family: sans-serif;">
        <p style="margin: 0; color: #666; margin-bottom: 10px;">
            &copy; 2024 Kumar Neupane. All rights reserved.
            <a href="calendar-widget.html" style="color: #38bdf8; text-decoration: none;"><span
                    style="font-size: 1.5em; vertical-align: middle; margin-right: 2px;">🇳🇵</span> Nepali Calendar</a>
            |
            <a href="fm.html" style="color: #38bdf8; text-decoration: none;"><span
                    style="font-size: 1.5em; vertical-align: middle; margin-right: 2px;">📻</span> FM</a>
        </p>
        <a href="index.html"
            style="display: inline-block; padding: 10px 20px; background-color: #38bdf8; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s; margin-top: 10px;">Return
            to Home</a>
    </div>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        iframe {
            max-width: 1200px;
        }

        /* Hover effect for the button */
        a:hover {
            background-color: #0284c7 !important;
        }
    </style>
</body>

</html>
